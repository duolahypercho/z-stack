<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}}</title>
{{FONT_LINK}}
<style>
/* z-stack:ui-demo · {{TITLE}}
   Tokens below are neutral placeholders. Replace them with the project's own
   (docs/DESIGN.md, a theme or tokens file). Keep the two dark blocks identical. */
:root {
  --page-bg: #F3F3F1; --window: #F4F4F4; --surface: #FCFCFC; --raised: #FFFFFF;
  --ink: #1C1C1C; --secondary: #5F5F63; --faint: #74747A; --accent: #126FD4;
  --line: rgba(28,28,28,.12); --hairline: rgba(28,28,28,.07); --strong: rgba(28,28,28,.24);
  --hover: rgba(28,28,28,.045); --selected: rgba(28,28,28,.075); --track: rgba(28,28,28,.06);
  --solid: #1C1C1C; --on-solid: #FCFCFC; --ok: #1F8A5B; --danger: #D93A3A;
  --win-shadow: 0 0 0 1px rgba(28,28,28,.10), 0 24px 48px -28px rgba(0,0,0,.40);
  --card-shadow: 0 1px 0 rgba(0,0,0,.03), 0 12px 32px -22px rgba(0,0,0,.28);
  --card-shadow-hover: 0 1px 0 rgba(0,0,0,.03), 0 18px 40px -20px rgba(0,0,0,.34);
  --sans: {{SANS}};
  --mono: ui-monospace, "SF Mono", "Geist Mono", Menlo, monospace;
  --radius: 12px; --ease: cubic-bezier(.16,1,.3,1); --fast: 150ms; --normal: 300ms;
  --win-w: {{W}}px; --win-h: {{H}}px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page-bg: #09090A; --window: #0D0D0D; --surface: #141415; --raised: #1F1F1F;
  --ink: #F5F5F5; --secondary: #A8A8AE; --faint: #8D8D94; --accent: #1E87F6;
  --line: rgba(245,245,245,.10); --hairline: rgba(245,245,245,.06); --strong: rgba(245,245,245,.22);
  --hover: rgba(245,245,245,.05); --selected: rgba(245,245,245,.09); --track: rgba(245,245,245,.06);
  --solid: #F5F5F5; --on-solid: #121212; --ok: #3DD68C; --danger: #FF6369;
  --win-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 24px 48px -28px rgba(0,0,0,.9);
  --card-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 12px 32px -22px rgba(0,0,0,.9);
  --card-shadow-hover: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px -20px rgba(0,0,0,.95);
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --page-bg: #09090A; --window: #0D0D0D; --surface: #141415; --raised: #1F1F1F;
  --ink: #F5F5F5; --secondary: #A8A8AE; --faint: #8D8D94; --accent: #1E87F6;
  --line: rgba(245,245,245,.10); --hairline: rgba(245,245,245,.06); --strong: rgba(245,245,245,.22);
  --hover: rgba(245,245,245,.05); --selected: rgba(245,245,245,.09); --track: rgba(245,245,245,.06);
  --solid: #F5F5F5; --on-solid: #121212; --ok: #3DD68C; --danger: #FF6369;
  --win-shadow: 0 0 0 1px rgba(255,255,255,.06), 0 24px 48px -28px rgba(0,0,0,.9);
  --card-shadow: 0 0 0 1px rgba(255,255,255,.02), 0 12px 32px -22px rgba(0,0,0,.9);
  --card-shadow-hover: 0 0 0 1px rgba(255,255,255,.04), 0 18px 40px -20px rgba(0,0,0,.95);
  color-scheme: dark;
}

/* ---- Site: the frame around the options ---- */
* { box-sizing: border-box; }
html, body { margin: 0; }
html { scroll-padding-top: 76px; }
body { background: var(--page-bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
.site { max-width: 1600px; margin: 0 auto; padding: clamp(24px, 4vw, 56px) 16px 80px; display: grid; gap: 24px; }

.mast { display: grid; gap: 8px; border-bottom: 2px solid var(--ink); padding-bottom: 20px; }
.kicker { font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.mast h1 { margin: 0; font: 600 clamp(28px, 1rem + 2.6vw, 48px)/1.06 var(--sans); letter-spacing: -.025em; max-width: 26ch; }
.lede { margin: 0; color: var(--secondary); max-width: 68ch; font-size: 15px; }
.meta { font: 12px var(--mono); color: var(--faint); }

.bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
  justify-content: space-between; margin: -12px -16px 0; padding: 10px 16px; background: var(--page-bg);
  background: color-mix(in srgb, var(--page-bg) 86%, transparent); -webkit-backdrop-filter: saturate(1.4) blur(12px);
  backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--hairline); }
.bar-group { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; background: var(--track); border-radius: 16px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--secondary); font-weight: 500; font-size: 12px;
  padding: 6px 12px; border-radius: 999px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center;
  transition: background var(--fast), color var(--fast); }
.seg button:hover { color: var(--ink); }
.seg button:active { transform: translateY(1px); }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background: var(--raised); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }
.seg .rec { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.seg[hidden] { display: none; }

/* Cards: one design each */
#view { display: grid; gap: 28px; }
.grid { display: grid; grid-template-columns: repeat(var(--cols, 2), minmax(0, 1fr)); gap: 20px; align-items: start; }
.card { display: grid; gap: 12px; align-content: start; background: var(--surface); border: 1px solid var(--hairline);
  border-radius: 16px; padding: 14px 14px 16px; box-shadow: var(--card-shadow); transition: box-shadow var(--normal) var(--ease); }
.card:hover { box-shadow: var(--card-shadow-hover); }
.card.rec { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.card-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.card-head h2 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -.01em; }
.letter { font: 600 12px var(--mono); min-width: 28px; height: 28px; padding: 0 7px; display: inline-grid; place-items: center;
  border-radius: 8px; background: var(--ink); color: var(--page-bg); }
.card[data-today] .letter { background: var(--track); color: var(--secondary); }
.chip { font: 500 11px var(--mono); letter-spacing: .04em; text-transform: uppercase; padding: 3px 8px; border-radius: 999px;
  background: var(--track); color: var(--secondary); }
.chip.accent { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.idea { margin: 0; }
.points { margin: 0; padding-left: 18px; color: var(--secondary); }
.cost { margin: 0; font: 12px/1.5 var(--mono); color: var(--secondary); }
.missing { color: var(--faint); font-style: italic; }
.ghost { justify-self: start; border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 7px 12px;
  font-weight: 500; cursor: pointer; transition: background var(--fast); }
.ghost:hover { background: var(--hover); }
.ghost:active { transform: translateY(1px); }
.ghost.tiny { padding: 3px 10px; font-size: 12px; margin-left: auto; }
.pill { border: 1px solid var(--line); background: transparent; border-radius: 999px; padding: 5px 12px; font-size: 12px;
  font-weight: 500; cursor: pointer; transition: background var(--fast); }
.pill:hover { background: var(--hover); }
.audit { font: 500 11px var(--mono); padding: 5px 10px; border-radius: 999px; color: var(--danger);
  background: color-mix(in srgb, var(--danger) 14%, transparent); }
.audit[data-ok="true"] { color: var(--ok); background: color-mix(in srgb, var(--ok) 14%, transparent); }
.audit[hidden] { display: none; }

/* The window each design is drawn in, scaled to fit */
.stage { position: relative; width: 100%; overflow: hidden; border-radius: var(--radius); }
.scaler { position: relative; width: var(--win-w); height: var(--win-h); transform-origin: top left; }
.stage.slide .scaler { position: absolute; top: 0; left: 0; }
.win { width: var(--win-w); height: var(--win-h); background: var(--window); border-radius: var(--radius);
  overflow: hidden; display: flex; position: relative; box-shadow: var(--win-shadow); }
.win > .baseline { width: 100%; height: 100%; object-fit: contain; background: var(--window); }
.todo { flex: 1; margin: 24px; border: 1.5px dashed var(--strong); border-radius: var(--radius);
  display: grid; place-content: center; gap: 6px; text-align: center; font-size: 18px; font-weight: 600; color: var(--secondary); }
.todo small { font-size: 12px; font-weight: 400; color: var(--faint); }
.slide .tag-l, .slide .tag-r { position: absolute; top: 10px; z-index: 2; font: 500 11px var(--mono); background: var(--ink);
  color: var(--page-bg); padding: 2px 8px; border-radius: 6px; pointer-events: none; }
.slide .tag-l { left: 10px; }
.slide .tag-r { right: 10px; }
.reveal { width: 100%; margin: 0; accent-color: var(--accent); }

/* Interaction kit inside the designs */
.win :is([data-act], [data-toggle], [data-set], [data-busy], [data-toast]) { cursor: pointer; }
.win .demo-dead { outline: 2px dashed var(--danger); outline-offset: 2px; }
.demo-toast { position: absolute; left: 50%; bottom: 28px; z-index: 20; transform: translate(-50%, 12px); opacity: 0;
  pointer-events: none; background: var(--solid); color: var(--on-solid); font: 500 14px/1.3 var(--sans); padding: 10px 16px;
  border-radius: 10px; box-shadow: 0 12px 32px -12px rgba(0,0,0,.45); transition: opacity var(--normal) var(--ease), transform var(--normal) var(--ease); }
.demo-toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Compare two */
.compare, .focus { display: grid; gap: 16px; }
.compare-ctl { display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; }
.side-pick { display: inline-flex; gap: 8px; align-items: center; }
.side-pick > span { font: 500 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; align-items: start; }

/* How they differ */
.traits { display: grid; gap: 10px; }
.traits h2, .pick h2 { margin: 0; font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--faint); }
.table-scroll { overflow-x: auto; border: 1px solid var(--hairline); border-radius: var(--radius); background: var(--surface); }
.traits table { width: 100%; border-collapse: collapse; min-width: 560px; }
.traits th, .traits td { text-align: left; vertical-align: top; padding: 10px 14px; border-bottom: 1px solid var(--hairline); }
.traits thead th { font: 500 12px var(--mono); color: var(--secondary); }
.traits tbody th { font-weight: 500; color: var(--secondary); width: 18%; }
.traits tr:last-child > * { border-bottom: 0; }
.traits tr.same td { color: var(--faint); }
.traits td.changed { font-weight: 500; }
.traits td.changed::before, .legend .dot { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); margin: 0 8px 1px 0; vertical-align: middle; }
.legend { margin: 0; font-size: 12px; color: var(--faint); }

/* Pick */
.pick { display: grid; gap: 10px; background: var(--surface); border: 1px solid var(--hairline); border-radius: 16px;
  padding: 16px; box-shadow: var(--card-shadow); }
.pick form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pick input { flex: 1 1 240px; min-width: 0; background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
.pick input::placeholder { color: var(--faint); }
.go { border: 0; background: var(--solid); color: var(--on-solid); font-weight: 600; padding: 8px 14px; border-radius: 8px;
  cursor: pointer; transition: opacity var(--fast); }
.go:hover { opacity: .88; }
.go:active { transform: translateY(1px); }
.status { margin: 0; color: var(--secondary); font-size: 12px; min-height: 1em; overflow-wrap: anywhere; }
.pick ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; }
.pick li { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--secondary); }
.pick li b { color: var(--ink); font-weight: 600; }

.hint { color: var(--faint); font-size: 12px; margin: 0; }
kbd { font: 500 11px var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

@media (max-width: 900px) { .grid { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) { .pair { grid-template-columns: minmax(0, 1fr); } .bar { position: static; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

/* ---- The options' own styles go below this line ---- */

</style>
</head>
<body>
<main class="site">
  <header class="mast">
    <span class="kicker">z-stack:ui-demo · Round {{ROUND}}</span>
    <h1>{{TITLE}}</h1>
    <p class="lede">{{SUBTITLE}}</p>
    <span class="meta" id="meta"></span>
  </header>

  <nav class="bar" aria-label="Demo controls">
    <div class="seg" role="group" aria-label="View">
      <button type="button" data-view="all" aria-pressed="true">All side by side</button>
      <button type="button" data-view="compare" aria-pressed="false">Compare two</button>
      <button type="button" data-view="focus" aria-pressed="false">One at a time</button>
    </div>
    <div class="bar-group">
      <div class="seg" id="scenarios" role="group" aria-label="Scenario" hidden></div>
      <div class="seg" role="group" aria-label="Clicks">
        <button type="button" data-linked="on" aria-pressed="true" title="One click shows in every design">Linked</button>
        <button type="button" data-linked="off" aria-pressed="false" title="Each design keeps its own clicks">Separate</button>
      </div>
      <button type="button" class="pill" data-reset title="Put every design back to its starting state">Reset</button>
      <div class="seg" id="themes" role="group" aria-label="Theme">
        <button type="button" data-theme-btn="dark" aria-pressed="false">Dark</button>
        <button type="button" data-theme-btn="light" aria-pressed="false">Light</button>
      </div>
      <span class="audit" id="audit" role="status" hidden></span>
    </div>
  </nav>

  <section id="view" aria-label="Designs"></section>

  <section class="pick" id="pick" aria-labelledby="pick-title">
    <h2 id="pick-title">Pick one to build</h2>
    <div class="seg" id="pick-options" role="radiogroup" aria-label="Design to pick"></div>
    <form id="pick-form">
      <input id="pick-reason" maxlength="280" autocomplete="off" placeholder="Why this one? (optional)">
      <button type="submit" class="go" id="pick-go">Pick</button>
    </form>
    <p class="status" id="pick-status" role="status"></p>
    <ol id="pick-list" aria-label="Picks so far"></ol>
  </section>

  <p class="hint">Every design works: click, type, open menus. <kbd>Esc</kbd> closes menus and dialogs. Keys <kbd>1</kbd> to <kbd id="last-key">4</kbd>: jump to a design, set the right side in Compare, or switch in One at a time. Sample data only.</p>
</main>

<script>
"use strict";
const DEMO = {{DEMO_JSON}};

// Fill in, for every option:
//   points: 2 or 3 trade-offs (the recommended one's downsides too)
//   cost:   the cost to build, in hours or days
//   traits: 3 to 5 short answers to the same questions, same keys in every option,
//           e.g. { "Where pages live": "Sidebar", "Steps to connect": "2" }. They fill "How they differ".
const OPTIONS = {{OPTIONS_JSON}};

// State the designs read. Set starting values here: Object.assign(state, { page: "General", sw: { login: true } }).
// Linked (the default) shares it across every design, so one click shows in all of them; Separate gives each its own.
let state = {};

// Named states the bar flips every design into at once, each a patch over the starting state. Optional.
// e.g. { "Typical": {}, "Empty": { apps: [] }, "Error": { error: "Couldn't reach the server" } }
const SCENARIOS = {};

// Interaction kit: most controls need no code (z-stack:ui-demo step 4).
//   data-toggle="sw.login"      flips a value: switches, checkboxes, expanders
//   data-set="page=Usage;menu="  sets values, empty clears: tabs, nav, menu items, radios
//   data-bind="query"           keeps a value in step with an input, select or checkbox
//   data-busy="sync"            "busy", then "done" a moment later: Check now, Connect, Send
//   data-toast="Saved"          a toast in that window (after busy, when both are set)
//   data-static                 looks clickable, meant to do nothing
//   data-act="name"             runs ACTIONS.name(el, event) for anything else
// state.menu holds the open menu and state.dialog the open dialog: Esc closes both, a click elsewhere closes the menu.
// Every design re-renders after each change, updating the page in place, so transitions run and scroll stays put.
// Don't put `id`s inside designs: each design is on the page more than once. Use classes and data-*.
const ACTIONS = {};
{{BASELINE_JS}}
// ---- Designs: one function per option, returning the whole window's HTML ----

{{RENDERS}}

const RENDER = { {{RENDER_MAP}} };

// ---- Picks ----
// As written, a pick stays in this browser and is copied to paste back to Claude.
// Publishing for a team? Replace submit() and list() with a shared store (z-stack:ui-demo, step 6).
const CHOICE = {
  async submit(pick) {
    store.set("pick", pick);
    const line = `Pick: ${pick.label}${pick.reason ? ` (${pick.reason})` : ""}`;
    return (await copy(line)) ? "Copied. Paste it back to Claude." : line;
  },
  async list() {
    const mine = store.get("pick");
    return mine ? [{ ...mine, who: "You" }] : [];
  },
};

// ---- Site: no need to edit below ----
const $ = (selector) => document.querySelector(selector);
const esc = (text) => String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const find = (id) => OPTIONS.find((option) => option.id === id);
const short = (option) => (option.id === "today" ? "Today" : option.id.toUpperCase());
const label = (option) => (option.id === "today" ? "Today" : `${option.id.toUpperCase()} · ${option.name}`);
const pickLabel = (option) => (option.id === "today" ? "Keep today's design" : `Pick ${label(option)}`);
const motion = () => (matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth");
const store = {
  key: `z-stack-ui-demo:${DEMO.slug}`,
  get(name) { try { return JSON.parse(localStorage.getItem(`${this.key}:${name}`)); } catch { return null; } },
  set(name, value) { try { localStorage.setItem(`${this.key}:${name}`, JSON.stringify(value)); } catch { /* storage blocked: the copied line still carries the pick */ } },
};
async function copy(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch { return false; }
}

const LEFT = (find("today") || OPTIONS[0]).id;
const view = {
  name: "all", theme: "dark", mode: "side", reveal: 50,
  option: OPTIONS[0].id,
  left: LEFT,
  right: (OPTIONS.find((o) => o.recommended && o.id !== LEFT) || OPTIONS.find((o) => o.id !== LEFT)).id,
  pick: (OPTIONS.find((o) => o.recommended) || OPTIONS.find((o) => o.id !== "today")).id,
  linked: true, scenario: Object.keys(SCENARIOS)[0] || null, audit: false,
};

// ---- Interaction kit ----
const KIT = "[data-act],[data-toggle],[data-set],[data-bind],[data-input],[data-busy],[data-toast],[data-static]";
const CONTROL = "button, a[href], input, select, textarea, summary, [role=button], [role=switch], [role=tab], [role=menuitem], [role=checkbox], [role=radio], [role=option], [tabindex]";
const NATIVE = "button, a, input, select, textarea, summary";
const BUSY_MS = 900;
const TOAST_MS = 1800;
const clone = (value) => { try { return structuredClone(value); } catch { return JSON.parse(JSON.stringify(value)); } };
const getPath = (object, path) => path.split(".").reduce((node, key) => (node == null ? undefined : node[key]), object);
function setPath(object, path, value) {
  const keys = path.split(".");
  const last = keys.pop();
  const parent = keys.reduce((node, key) => (node[key] && typeof node[key] === "object" ? node[key] : (node[key] = {})), object);
  parent[last] = value;
}
const parseValue = (text) => (text === "" || text === "null" ? null : text === "true" ? true : text === "false" ? false : text);
const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

// Linked: every design reads `shared`. Separate: each window gets its own copy, made on first use.
const START = clone(state);
const shared = state;
const own = new Map();
function stateFor(win) {
  if (view.linked) return shared;
  const key = `${win.dataset.slot}:${win.dataset.option}`;
  if (!own.has(key)) own.set(key, clone(shared));
  return own.get(key);
}
function within(win, fn) {
  const outer = state;
  state = stateFor(win);
  try { return fn(); } finally { state = outer; }
}

// Update a window in place, so CSS transitions run and scroll, focus and typing survive a re-render.
function morph(target, html) {
  const next = document.createElement("template");
  next.innerHTML = html;
  patchChildren(target, next.content);
}
function patchChildren(parent, source) {
  const before = [...parent.childNodes];
  const after = [...source.childNodes];
  after.forEach((node, i) => (before[i] ? patchNode(before[i], node) : parent.appendChild(node)));
  before.slice(after.length).forEach((node) => node.remove());
}
function patchNode(current, next) {
  if (current.nodeType !== next.nodeType || current.nodeName !== next.nodeName) return current.replaceWith(next);
  if (current.nodeType !== Node.ELEMENT_NODE) {
    if (current.nodeValue !== next.nodeValue) current.nodeValue = next.nodeValue;
    return;
  }
  [...current.attributes].forEach(({ name }) => { if (!next.hasAttribute(name)) current.removeAttribute(name); });
  [...next.attributes].forEach(({ name, value }) => { if (current.getAttribute(name) !== value) current.setAttribute(name, value); });
  if (current.tagName !== "TEXTAREA") patchChildren(current, next);
  syncFormValue(current, next);
}
function syncFormValue(current, next) {
  if (current === document.activeElement) return;
  if (current.tagName === "INPUT") {
    if (current.type === "checkbox" || current.type === "radio") current.checked = next.hasAttribute("checked");
    else if (current.value !== (next.getAttribute("value") ?? "")) current.value = next.getAttribute("value") ?? "";
  } else if (current.tagName === "TEXTAREA") {
    if (current.value !== next.textContent) current.value = next.textContent;
  } else if (current.tagName === "SELECT") {
    const chosen = [...current.options].findIndex((option) => option.hasAttribute("selected"));
    if (chosen >= 0) current.selectedIndex = chosen;
  }
}

function runKit(el, win, event) {
  const data = el.dataset;
  within(win, () => {
    if (data.set) {
      data.set.split(";").forEach((pair) => {
        const at = pair.indexOf("=");
        if (at > 0) setPath(state, pair.slice(0, at).trim(), parseValue(pair.slice(at + 1).trim()));
      });
    }
    if (data.toggle) setPath(state, data.toggle, !getPath(state, data.toggle));
    if (data.act) {
      const handler = ACTIONS[data.act];
      if (handler) handler(el, event);
      else console.warn(`ui-demo: no ACTIONS.${data.act}`);
    }
  });
  paint();
  if (data.busy) return busy(win, data.busy, data.toast);
  if (data.toast) toast(win, data.toast);
}

async function busy(win, path, message) {
  within(win, () => setPath(state, path, "busy"));
  paint();
  await sleep(BUSY_MS);
  within(win, () => setPath(state, path, "done"));
  paint();
  if (message) toast(win, message);
}

const toastTimers = new WeakMap();
function toast(win, message) {
  const host = win.parentElement;
  let el = host.querySelector(":scope > .demo-toast");
  if (!el) {
    el = document.createElement("div");
    el.className = "demo-toast";
    el.setAttribute("role", "status");
    host.appendChild(el);
  }
  el.textContent = message;
  el.classList.remove("show");
  void el.offsetWidth;
  el.classList.add("show");
  clearTimeout(toastTimers.get(el));
  toastTimers.set(el, setTimeout(() => el.classList.remove("show"), TOAST_MS));
}

function dismiss() {
  const close = (s) => {
    const open = Boolean(s.menu || s.dialog);
    if (s.menu) s.menu = null;
    if (s.dialog) s.dialog = null;
    return open;
  };
  let changed = close(shared);
  own.forEach((s) => { changed = close(s) || changed; });
  if (changed) paint();
}

function clickInWindow(event, win) {
  if (event.target.closest("a[href]")) event.preventDefault();
  const el = event.target.closest(KIT);
  if (el && win.contains(el)) {
    const data = el.dataset;
    if (data.set || data.toggle || data.act || data.busy || data.toast) runKit(el, win, event);
    return;
  }
  if (within(win, () => state.menu)) {
    within(win, () => { state.menu = null; });
    paint();
  }
}

// Controls that look clickable but do nothing: every one is a dead end in a prototype.
function audit(mark) {
  const dead = [];
  document.querySelectorAll("#view .demo-dead").forEach((el) => el.classList.remove("demo-dead"));
  document.querySelectorAll("#view .win").forEach((win) => {
    win.querySelectorAll("*").forEach((el) => {
      const pointer = getComputedStyle(el).cursor === "pointer" && getComputedStyle(el.parentElement).cursor !== "pointer";
      if (!el.matches(CONTROL) && !pointer) return;
      const wired = el.closest(KIT);
      if (wired && win.contains(wired)) return;
      const what = (el.getAttribute("aria-label") || el.textContent || el.tagName.toLowerCase()).trim().replace(/\s+/g, " ").slice(0, 48);
      dead.push({ design: win.dataset.option, what });
      if (mark) el.classList.add("demo-dead");
    });
  });
  return dead;
}
function showAudit() {
  const dead = audit(true);
  const badge = $("#audit");
  badge.hidden = false;
  badge.dataset.ok = String(dead.length === 0);
  badge.textContent = dead.length ? `${dead.length} dead ${dead.length === 1 ? "control" : "controls"}` : "Every control works";
  badge.title = dead.map((d) => `${d.design.toUpperCase()}: ${d.what}`).join("\n");
}
window.uiDemo = { audit: () => audit(false) };

function renderScenarios() {
  const names = Object.keys(SCENARIOS);
  $("#scenarios").hidden = !names.length;
  $("#scenarios").innerHTML = names.map((name) =>
    `<button type="button" data-scenario="${esc(name)}" aria-pressed="${name === view.scenario}">${esc(name)}</button>`).join("");
}
function applyScenario(name) {
  view.scenario = name in SCENARIOS ? name : null;
  const base = Object.assign(clone(START), clone(view.scenario ? SCENARIOS[view.scenario] : {}));
  Object.keys(shared).forEach((key) => delete shared[key]);
  Object.assign(shared, base);
  own.clear();
  renderScenarios();
  paint();
  syncUrl();
}
function setLinked(on) {
  view.linked = on;
  own.clear();
  document.querySelectorAll("[data-linked]").forEach((button) => button.setAttribute("aria-pressed", String((button.dataset.linked === "on") === on)));
  paint();
  syncUrl();
}

// Pieces
const stage = (id, slot) =>
  `<div class="stage" data-stage><div class="scaler"><div class="win" data-option="${id}" data-slot="${slot}"></div></div></div>`;
const pickButton = (option) => `<button type="button" class="ghost" data-pick="${option.id}">${esc(pickLabel(option))}</button>`;
function head(option) {
  return `<header class="card-head"><span class="letter">${short(option)}</span><h2>${esc(option.name)}</h2>${
    option.recommended ? '<span class="chip accent">Recommended</span>' : ""}${view.name === "focus" ? "" :
    `<button type="button" class="ghost tiny" data-try="${option.id}" aria-label="Try ${esc(label(option))} full size">Full size</button>`}</header>`;
}
function about(option) {
  const today = option.id === "today";
  const points = option.points.length
    ? option.points.map((point) => `<li>${esc(point)}</li>`).join("")
    : today ? "" : '<li class="missing">Add 2 or 3 trade-offs in OPTIONS</li>';
  const cost = option.cost ? esc(option.cost) : '<span class="missing">Add the cost to build in OPTIONS</span>';
  return `<p class="idea">${esc(option.idea)}</p>${points ? `<ul class="points">${points}</ul>` : ""}<p class="cost">${cost}</p>`;
}
function card(option, slot, withStage = true) {
  return `<article class="card${option.recommended ? " rec" : ""}"${option.id === "today" ? " data-today" : ""}
    id="card-${slot}-${option.id}" aria-label="${esc(label(option))}">${head(option)}${withStage ? stage(option.id, slot) : ""}${
    about(option)}${pickButton(option)}</article>`;
}

function traits() {
  const keys = [...new Set(OPTIONS.flatMap((option) => Object.keys(option.traits || {})))];
  const title = '<h2 id="traits-title">How they differ</h2>';
  if (!keys.length) {
    return `<section class="traits" aria-labelledby="traits-title">${title}<p class="missing">Add 3 to 5 traits to every option in OPTIONS, with the same keys.</p></section>`;
  }
  const today = find("today");
  const value = (option, key) => (option.traits && option.traits[key]) || "";
  const rows = keys.map((key) => {
    const values = OPTIONS.map((option) => value(option, key));
    const same = values.every((v) => v === values[0]);
    const cells = OPTIONS.map((option, i) => {
      const changed = today && option !== today && !same && values[i] !== value(today, key);
      return `<td${changed ? ' class="changed"' : ""}>${values[i] ? esc(values[i]) : '<span class="missing">Not filled</span>'}</td>`;
    }).join("");
    return `<tr${same ? ' class="same"' : ""}><th scope="row">${esc(key)}</th>${cells}</tr>`;
  }).join("");
  const legend = today
    ? '<p class="legend"><span class="dot"></span>differs from today · grey rows are the same in every design</p>'
    : '<p class="legend">Grey rows are the same in every design.</p>';
  return `<section class="traits" aria-labelledby="traits-title">${title}<div class="table-scroll"><table>
    <thead><tr><th scope="col"><span class="sr">Question</span></th>${OPTIONS.map((o) => `<th scope="col">${esc(label(o))}</th>`).join("")}</tr></thead>
    <tbody>${rows}</tbody></table></div>${legend}</section>`;
}

// Views
function buildAll() {
  const cols = OPTIONS.length <= 3 ? OPTIONS.length : 2;
  return `<div class="grid" style="--cols:${cols}">${OPTIONS.map((option) => card(option, "all")).join("")}</div>${traits()}`;
}

function buildCompare() {
  const side = (name) => `<div class="side-pick"><span>${name}</span><div class="seg" role="group" aria-label="${name} design">${
    OPTIONS.map((o) => `<button type="button" data-side="${name.toLowerCase()}" data-id="${o.id}" aria-pressed="${view[name.toLowerCase()] === o.id}">${esc(short(o))}</button>`).join("")}</div></div>`;
  const modes = `<div class="seg" role="group" aria-label="Compare as">${[["side", "Side by side"], ["slide", "Slider"]].map(([mode, text]) =>
    `<button type="button" data-mode="${mode}" aria-pressed="${view.mode === mode}">${text}</button>`).join("")}</div>`;
  const left = find(view.left);
  const right = find(view.right);
  const body = view.mode === "slide"
    ? `<div class="card"><div class="stage slide" data-stage>
        <div class="scaler"><div class="win" data-option="${left.id}" data-slot="under"></div></div>
        <div class="scaler over" style="clip-path: inset(0 0 0 ${view.reveal}%)"><div class="win" data-option="${right.id}" data-slot="over"></div></div>
        <span class="tag-l">${esc(label(left))}</span><span class="tag-r">${esc(label(right))}</span></div>
        <input type="range" class="reveal" min="0" max="100" value="${view.reveal}" aria-label="Drag to reveal ${esc(label(right))}"></div>
      <div class="pair">${card(left, "left", false)}${card(right, "right", false)}</div>`
    : `<div class="pair">${card(left, "left")}${card(right, "right")}</div>`;
  return `<div class="compare"><div class="compare-ctl">${side("Left")}${side("Right")}${modes}</div>${body}</div>`;
}

function buildFocus() {
  const option = find(view.option);
  const switcher = `<div class="seg" role="group" aria-label="Design">${OPTIONS.map((o, i) =>
    `<button type="button" data-opt="${o.id}" aria-pressed="${o.id === option.id}" aria-keyshortcuts="${i + 1}">${
      o.recommended ? '<span class="rec" aria-label="Recommended"></span>' : ""}${esc(label(o))}</button>`).join("")}</div>`;
  return `<div class="focus">${switcher}${card(option, "focus", false)}${stage(option.id, "focus")}</div>`;
}

// Drawing
function fitStage(element) {
  const scale = Math.min(1, element.clientWidth / DEMO.size.w);
  element.querySelectorAll(".scaler").forEach((scaler) => { scaler.style.transform = `scale(${scale})`; });
  element.style.height = `${DEMO.size.h * scale}px`;
}
const sizer = new ResizeObserver((entries) => entries.forEach((entry) => fitStage(entry.target)));

function paint() {
  document.querySelectorAll("#view .win[data-option]").forEach((win) =>
    within(win, () => morph(win, RENDER[win.dataset.option]())));
  if (view.audit) showAudit();
}

function build() {
  sizer.disconnect();
  $("#view").innerHTML = { all: buildAll, compare: buildCompare, focus: buildFocus }[view.name]();
  document.querySelectorAll("[data-view]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.view === view.name));
  document.querySelectorAll("#view [data-stage]").forEach((element) => { fitStage(element); sizer.observe(element); });
  paint();
  renderPickOptions();
  syncUrl();
}

function go(patch) {
  Object.assign(view, patch);
  build();
}

function setTheme(theme) {
  view.theme = DEMO.themes.includes(theme) ? theme : DEMO.themes[0];
  document.documentElement.dataset.theme = view.theme;
  document.querySelectorAll("[data-theme-btn]").forEach((button) => button.setAttribute("aria-pressed", button.dataset.themeBtn === view.theme));
  paint();
  syncUrl();
}

function syncUrl() {
  try {
    const url = new URL(location.href);
    const params = {
      view: view.name,
      theme: DEMO.themes.length > 1 ? view.theme : null,
      option: view.name === "focus" ? view.option : null,
      left: view.name === "compare" ? view.left : null,
      right: view.name === "compare" ? view.right : null,
      mode: view.name === "compare" ? view.mode : null,
      scenario: view.scenario,
      linked: view.linked ? null : "0",
      audit: view.audit ? "1" : null,
    };
    Object.entries(params).forEach(([key, value]) => (value ? url.searchParams.set(key, value) : url.searchParams.delete(key)));
    history.replaceState(null, "", url);
  } catch { /* sandboxed frame: the URL just doesn't follow along */ }
}

// Picks
function renderPickOptions() {
  $("#pick-options").innerHTML = OPTIONS.map((o) =>
    `<button type="button" role="radio" data-pick-opt="${o.id}" aria-checked="${o.id === view.pick}">${esc(short(o))}</button>`).join("");
  $("#pick-go").textContent = pickLabel(find(view.pick));
}

function choose(id, jump) {
  if (!find(id)) return;
  view.pick = id;
  renderPickOptions();
  if (!jump) return;
  $("#pick").scrollIntoView({ block: "start", behavior: motion() });
  $("#pick-reason").focus({ preventScroll: true });
}

async function renderPicks() {
  let picks = [];
  try { picks = await CHOICE.list(); } catch (error) { $("#pick-status").textContent = `Couldn't load picks: ${error.message}`; }
  const counts = OPTIONS.map((option) => [option, picks.filter((pick) => pick.option === option.id).length]).filter(([, n]) => n);
  const summary = counts.map(([option, n]) => `<li><b>${esc(label(option))}</b><span>${n} ${n === 1 ? "pick" : "picks"}</span></li>`);
  const reasons = picks.filter((pick) => pick.reason).map((pick) =>
    `<li><b>${esc(pick.who || "Someone")}</b><span>${esc(pick.label)}: ${esc(pick.reason)}</span></li>`);
  $("#pick-list").innerHTML = summary.concat(reasons).join("");
}

$("#pick-form").addEventListener("submit", async (event) => {
  event.preventDefault();
  const option = find(view.pick);
  const pick = { option: option.id, label: label(option), reason: $("#pick-reason").value.trim(), at: new Date().toISOString() };
  try { $("#pick-status").textContent = await CHOICE.submit(pick); } catch (error) { $("#pick-status").textContent = `Pick not saved: ${error.message}`; }
  renderPicks();
});

// Input
document.addEventListener("click", (event) => {
  const win = event.target.closest("#view .win");
  if (win) return clickInWindow(event, win);
  const el = event.target.closest("[data-view],[data-theme-btn],[data-opt],[data-side],[data-mode],[data-pick],[data-pick-opt],[data-try],[data-linked],[data-scenario],[data-reset]");
  if (!el) return;
  const data = el.dataset;
  if (data.view) return go({ name: data.view });
  if (data.themeBtn) return setTheme(data.themeBtn);
  if (data.opt) return go({ option: data.opt });
  if (data.side) return go({ [data.side]: data.id });
  if (data.mode) return go({ mode: data.mode });
  if (data.pick) return choose(data.pick, true);
  if (data.pickOpt) return choose(data.pickOpt, false);
  if (data.linked) return setLinked(data.linked === "on");
  if (data.scenario !== undefined) return applyScenario(data.scenario);
  if (data.reset !== undefined) return applyScenario(view.scenario);
  if (data.try) {
    go({ name: "focus", option: data.try });
    $("#view").scrollIntoView({ block: "start", behavior: motion() });
  }
});
document.addEventListener("submit", (event) => {
  if (event.target.closest("#view .win")) event.preventDefault();
});
document.addEventListener("input", (event) => {
  const target = event.target;
  if (target.classList.contains("reveal")) {
    view.reveal = Number(target.value);
    const over = $("#view .scaler.over");
    if (over) over.style.clipPath = `inset(0 0 0 ${view.reveal}%)`;
    return;
  }
  const win = target.closest("#view .win");
  if (!win) return;
  if (target.dataset.bind) {
    within(win, () => setPath(state, target.dataset.bind, target.type === "checkbox" ? target.checked : target.value));
    return paint();
  }
  const handler = ACTIONS[target.dataset.input];
  if (!handler) return;
  within(win, () => handler(target, event));
  paint();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") return dismiss();
  const el = event.target instanceof Element ? event.target : null;
  if (el && (event.key === "Enter" || event.key === " ") && el.closest("#view .win") && el.matches(KIT) && !el.matches(NATIVE)) {
    event.preventDefault();
    return el.click();
  }
  const typing = el && el.closest("input, textarea, select, [contenteditable]");
  if (event.metaKey || event.ctrlKey || event.altKey || typing) return;
  const option = OPTIONS[Number(event.key) - 1];
  if (!option) return;
  if (view.name === "focus") return go({ option: option.id });
  if (view.name === "compare") return go({ right: option.id });
  const target = document.getElementById(`card-all-${option.id}`);
  if (target) target.scrollIntoView({ block: "start", behavior: motion() });
});

(function start() {
  const params = new URLSearchParams(location.search);
  if (["all", "compare", "focus"].includes(params.get("view"))) view.name = params.get("view");
  if (["side", "slide"].includes(params.get("mode"))) view.mode = params.get("mode");
  ["option", "left", "right"].forEach((key) => { if (find(params.get(key))) view[key] = params.get(key); });
  if (params.get("scenario") in SCENARIOS) view.scenario = params.get("scenario");
  view.audit = params.get("audit") === "1";
  if (params.get("linked") === "0") setLinked(false);
  const real = OPTIONS.filter((o) => o.id !== "today").length;
  $("#meta").textContent = `${real} designs${find("today") ? " + today" : ""} · drawn at ${DEMO.size.w} × ${DEMO.size.h} · ${DEMO.date}`;
  $("#last-key").textContent = String(OPTIONS.length);
  $("#themes").hidden = DEMO.themes.length < 2;
  setTheme(params.get("theme") || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
  if (view.scenario) applyScenario(view.scenario);
  renderScenarios();
  build();
  renderPicks();
})();
</script>
</body>
</html>
